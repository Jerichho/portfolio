<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8fafc;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1" flood-color="#1e40af" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background with rounded corners matching website style -->
  <rect width="32" height="32" rx="8" fill="url(#bgGradient)"/>
  
  <!-- Subtle inner highlight for depth -->
  <rect width="28" height="28" x="2" y="2" rx="6" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  
  <!-- Main letter J with shadow -->
  <text x="16" y="22" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" 
        text-anchor="middle" fill="url(#textGradient)" filter="url(#shadow)">J</text>
  
  <!-- Subtle accent dots matching the website's clean aesthetic -->
  <circle cx="26" cy="6" r="1.5" fill="rgba(255,255,255,0.4)"/>
  <circle cx="6" cy="26" r="1" fill="rgba(255,255,255,0.3)"/>
</svg> 